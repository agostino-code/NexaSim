name: Build and Test NexaSim

on:
  workflow_call:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]

jobs:
  validate-scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate all scenario YAML definitions
        run: |
          for f in scenarios/library/*.yaml; do
            echo "Validating $f..."
            python tools/gen_scenario.py "$f" --validate
          done

  build-and-run:
    runs-on: ubuntu-latest
    needs: validate-scenarios
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build NexaSim (Docker & Conan 2)
        run: docker compose run --rm nexasim-build

      - name: Run validation scenario
        run: docker compose run --rm nexasim-scenario

      - name: Analyze simulation results
        run: docker compose run --rm nexasim-analyze
