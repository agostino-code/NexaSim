services:
  # NexaSim Studio Interactive Web Server & Warm Simulation Daemon
  nexasim-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nexasim-studio
    ports:
      - "8000:8000"
    volumes:
      - ./scenarios:/artery/scenarios
      - ./config:/artery/config
      - ./output:/artery/output
    working_dir: /artery
    environment:
      - CONAN_HOME=/root/.conan2
      - PYTHONUNBUFFERED=1
    command: python3 tools/studio.py --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # NexaSim Build Environment (for full recompilation)
  nexasim-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: sim-builder
    volumes:
      - .:/artery
      - artery-conan2-cache:/root/.conan2
      - artery-build-cache:/root/.cache
    environment:
      - CONAN_HOME=/root/.conan2
    command: >
      bash -c "
        cd /artery &&
        conan export recipes/inet --version 4.2.2 &&
        conan export recipes/space_veins --version 0.3 &&
        conan export recipes/simu5g --version 1.1.0 &&
        conan export recipes/vanetza --version 26.02 &&
        conan profile detect --force &&
        conan install . --build=missing -s build_type=Release &&
        cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/artery/build/Release/generators/conan_toolchain.cmake -DOMNETPP_ROOT=/omnetpp &&
        cmake --build build/Release --parallel
      "

  # Base template for runtime services
  nexasim: &run-template
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - ./scenarios:/artery/scenarios
      - ./config:/artery/config
      - ./output:/artery/output
      - artery-conan2-cache:/root/.conan2
    working_dir: /artery
    environment:
      - CONAN_HOME=/root/.conan2
      - PYTHONUNBUFFERED=1

  # NexaSim Headless Runtime Worker (supports instant docker exec)
  nexasim-worker:
    <<: *run-template
    container_name: nexasim-worker

  # Backward compatibility alias
  nexasim-run:
    <<: *run-template

  # NexaSim Scenario Runner
  nexasim-scenario:
    <<: *run-template
    command: >
      bash -c "
        python3 tools/nexasim.py run stelvio
      "

  # NexaSim Analysis Service
  nexasim-analyze:
    <<: *run-template
    command: >
      bash -c "
        python3 tools/analyze_results.py scenarios/generated/stelvio/
      "

volumes:
  artery-conan2-cache:
  artery-build-cache:
