services:
  # NexaSim Build environment
  nexasim-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: headless
    volumes:
      - .:/artery
      - artery-conan2-cache:/root/.conan2
      - artery-build-cache:/root/.cache
    environment:
      - CONAN_HOME=/root/.conan2
    command: >
      bash -c "
        cd /artery &&
        conan export recipes/inet --version 4.2.2 &&
        conan export recipes/space_veins --version 0.3 &&
        conan export recipes/simu5g --version 1.1.0 &&
        conan export recipes/vanetza --version 26.02 &&
        conan profile detect --force &&
        conan install . --build=missing --build=vanetza -s build_type=Release &&
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=/artery/build/Release/generators/conan_toolchain.cmake -DOMNETPP_ROOT=/omnetpp -G Ninja &&
        cmake --build build --parallel
      "

  # NexaSim Headless Runtime environment
  nexasim: &run-service
    build:
      context: .
      dockerfile: Dockerfile
      target: headless
    volumes:
      - .:/artery
      - artery-conan2-cache:/root/.conan2
      - ./output:/artery/output
      - ./config:/artery/config
      - ./scenarios:/artery/scenarios
    working_dir: /artery
    environment:
      - CONAN_HOME=/root/.conan2

  # Backward compatibility alias
  nexasim-run:
    <<: *run-service

  # NexaSim Scenario runner
  nexasim-scenario:
    <<: *run-service
    command: >
      bash -c "
        python3 tools/nexasim.py all stelvio
      "
    depends_on:
      - nexasim-build

  # NexaSim Analysis service
  nexasim-analyze:
    <<: *run-service
    command: >
      bash -c "
        python3 tools/analyze_results.py scenarios/generated/stelvio/
      "

  # NexaSim Interactive Web GUI service (OMNeT++ Qtenv via NoVNC)
  nexasim-gui:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    volumes:
      - .:/artery
      - artery-conan2-cache:/root/.conan2
      - ./output:/artery/output
      - ./config:/artery/config
      - ./scenarios:/artery/scenarios
    working_dir: /artery
    ports:
      - "6080:6080"
    command: >
      bash tools/start_gui.sh -f /artery/scenarios/generated/stelvio/omnetpp.ini
    depends_on:
      - nexasim-build

volumes:
  artery-conan2-cache:
  artery-build-cache:
